name: Publish Free AAR to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag LTS Android (ex: v8.1.7-lts-android) -- where the AARs are downloaded from'
        required: true
      publish_version:
        description: 'Maven version to publish, when it differs from the tag (ex: 8.1.8 for a metadata-only fix reusing v8.1.7-lts-android binaries). Leave empty to use the tag version.'
        required: false
        default: ''
      redirects_only:
        description: 'Publish ONLY the ffmpegkit/ffmpeg-kit search-alias redirects (skip the primary artifact -- use when the primary is already live and only the new alias publications need to go out)'
        required: false
        default: 'false'
      https_aliases_only:
        description: 'Publish ONLY ffmpeg-kit-https + ffmpeg-kit-https-gpl (real distinct AARs, downloaded from the same release_tag) -- skips the primary artifact and the redirects'
        required: false
        default: 'false'
      min_audio_video_aliases_only:
        description: 'Publish ONLY ffmpeg-kit-min + ffmpeg-kit-audio + ffmpeg-kit-video (real distinct AARs, downloaded from the same release_tag) -- skips the primary artifact and the redirects'
        required: false
        default: 'false'
      min_gpl_alias_only:
        description: 'Publish ONLY ffmpeg-kit-min-gpl (real distinct AAR, downloaded from the same release_tag) -- skips the primary artifact and the redirects'
        required: false
        default: 'false'
      full_full_gpl_aliases_only:
        description: 'Publish ONLY ffmpeg-kit-full + ffmpeg-kit-full-gpl (real distinct AARs, downloaded from the same release_tag) -- skips the primary artifact and the redirects'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Detect version and LTS branch
        id: meta
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          NUM=$(echo "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          MAJOR=$(echo "$NUM" | cut -d. -f1)
          # The three lines all publish the primary under the SAME coordinate:
          # coordinates("dev.ffmpegkit-maintained", "ffmpeg", publishVersion), in each
          # line's build.gradle. ARTIFACT is used for one thing only -- asking Maven
          # Central whether this version is already there -- so it must be that name.
          #
          # WARNING: it used to be "ffmpeg-81" and "ffmpeg-71", which do not exist on
          # Maven Central. The curl always 404'd, so the "already published, skipping"
          # guard could never fire on the 7.1 and 8.1 lines. It read like a guard.
          ARTIFACT="ffmpeg"
          if [ "$MAJOR" = "8" ]; then
            LTS="android-8.1-lts"
            AAR_NAME="ffmpeg-kit-free81-${NUM}-arm64-v8a-x86_64.aar"
          elif [ "$MAJOR" = "7" ]; then
            LTS="android-7.1-lts"
            AAR_NAME="ffmpeg-kit-free71-${NUM}-arm64-v8a-x86_64.aar"
          else
            LTS="android-6.0-lts"
            AAR_NAME="ffmpeg-kit-free-${NUM}-arm64-v8a-x86_64.aar"
          fi
          # Two distinct versions, and conflating them is the trap this input exists
          # to avoid. `version` names the AAR files inside the GitHub Release and must
          # follow the tag. `publish_version` is the Maven coordinate and may run ahead
          # of it -- a POM-only correction republishes identical binaries under a new
          # version, because Maven Central is immutable and the old one cannot be fixed.
          PUBLISH="${{ github.event.inputs.publish_version }}"
          [ -z "$PUBLISH" ] && PUBLISH="$NUM"
          echo "lts=$LTS"                   >> $GITHUB_OUTPUT
          echo "artifact=$ARTIFACT"         >> $GITHUB_OUTPUT
          echo "aar_name=$AAR_NAME"         >> $GITHUB_OUTPUT
          echo "version=$NUM"               >> $GITHUB_OUTPUT
          echo "publish_version=$PUBLISH"   >> $GITHUB_OUTPUT
          echo "Assets from tag: $NUM | published to Maven Central as: $PUBLISH"

      - name: Download AAR from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LTS="${{ steps.meta.outputs.lts }}"
          AAR_NAME="${{ steps.meta.outputs.aar_name }}"
          DEST="${LTS}/android/ffmpeg-kit-android-lib/build/outputs/aar/ffmpeg-kit-release.aar"
          mkdir -p "$(dirname "$DEST")"
          # ⚠️ Le primaire porte arm64-v8a + x86_64 depuis 2026-09-24 et son fichier
          # le dit. Les releases anterieures portent l'ancien nom, et republier une
          # ancienne version est un cas reel -- c'est a quoi sert `publish_version`.
          # On essaie le nom actuel, puis l'ancien.
          ANCIEN_NOM="${AAR_NAME/-arm64-v8a-x86_64.aar/-arm64-v8a.aar}"
          if ! gh release download "${{ github.event.inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern "$AAR_NAME" --output "$DEST"; then
            echo "::notice::$AAR_NAME absent de la release, essai avec $ANCIEN_NOM"
            gh release download "${{ github.event.inputs.release_tag }}" \
              --repo "$GITHUB_REPOSITORY" --pattern "$ANCIEN_NOM" --output "$DEST"
          fi
          echo "Downloaded: $(du -sh "$DEST")"

      - name: Download https/https-gpl AARs from GitHub Release (https_aliases_only mode)
        if: github.event.inputs.https_aliases_only == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LTS="${{ steps.meta.outputs.lts }}"
          VERSION="${{ steps.meta.outputs.version }}"
          DEST_DIR="${LTS}/android/ffmpeg-kit-android-lib/prebuilt-aars"
          mkdir -p "$DEST_DIR"
          gh release download "${{ github.event.inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ffmpeg-kit-https-${VERSION}-arm64-v8a-x86_64.aar" \
            --output "${DEST_DIR}/ffmpeg-kit-https.aar"
          gh release download "${{ github.event.inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ffmpeg-kit-https-gpl-${VERSION}-arm64-v8a-x86_64.aar" \
            --output "${DEST_DIR}/ffmpeg-kit-https-gpl.aar"
          ls -la "$DEST_DIR"

      - name: Download min/audio/video AARs from GitHub Release (min_audio_video_aliases_only mode)
        if: github.event.inputs.min_audio_video_aliases_only == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LTS="${{ steps.meta.outputs.lts }}"
          VERSION="${{ steps.meta.outputs.version }}"
          DEST_DIR="${LTS}/android/ffmpeg-kit-android-lib/prebuilt-aars"
          mkdir -p "$DEST_DIR"
          for name in min audio video; do
            gh release download "${{ github.event.inputs.release_tag }}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "ffmpeg-kit-${name}-${VERSION}-arm64-v8a-x86_64.aar" \
              --output "${DEST_DIR}/ffmpeg-kit-${name}.aar"
          done
          ls -la "$DEST_DIR"

      - name: Download min-gpl AAR from GitHub Release (min_gpl_alias_only mode)
        if: github.event.inputs.min_gpl_alias_only == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LTS="${{ steps.meta.outputs.lts }}"
          VERSION="${{ steps.meta.outputs.version }}"
          DEST_DIR="${LTS}/android/ffmpeg-kit-android-lib/prebuilt-aars"
          mkdir -p "$DEST_DIR"
          gh release download "${{ github.event.inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ffmpeg-kit-min-gpl-${VERSION}-arm64-v8a-x86_64.aar" \
            --output "${DEST_DIR}/ffmpeg-kit-min-gpl.aar"
          ls -la "$DEST_DIR"

      - name: Download full/full-gpl AARs from GitHub Release (full_full_gpl_aliases_only mode)
        if: github.event.inputs.full_full_gpl_aliases_only == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LTS="${{ steps.meta.outputs.lts }}"
          VERSION="${{ steps.meta.outputs.version }}"
          DEST_DIR="${LTS}/android/ffmpeg-kit-android-lib/prebuilt-aars"
          mkdir -p "$DEST_DIR"
          gh release download "${{ github.event.inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ffmpeg-kit-full-${VERSION}-arm64-v8a-x86_64.aar" \
            --output "${DEST_DIR}/ffmpeg-kit-full.aar"
          gh release download "${{ github.event.inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ffmpeg-kit-full-gpl-${VERSION}-arm64-v8a-x86_64.aar" \
            --output "${DEST_DIR}/ffmpeg-kit-full-gpl.aar"
          ls -la "$DEST_DIR"

      - name: Publish to Maven Central (primary + redirects)
        working-directory: ${{ steps.meta.outputs.lts }}/android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: "B30609B4"
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          PUBLISH_VERSION="${{ steps.meta.outputs.publish_version }}"
          ARTIFACT="${{ steps.meta.outputs.artifact }}"
          GROUP="dev.ffmpegkit-maintained"
          chmod +x gradlew

          if [ "${{ github.event.inputs.https_aliases_only }}" = "true" ]; then
            echo "Https-aliases-only mode: publishing ffmpeg-kit-https + ffmpeg-kit-https-gpl (real AARs), skipping primary/redirects."
            ./gradlew :ffmpeg-kit-android-lib:publishMavenHttpsPublicationToMavenCentralRepository \
              :ffmpeg-kit-android-lib:publishMavenHttpsGplPublicationToMavenCentralRepository \
              --no-configuration-cache --no-daemon \
              -x :ffmpeg-kit-android-lib:bundleReleaseAar \
              -Ppublish.version="${PUBLISH_VERSION}"
          elif [ "${{ github.event.inputs.min_audio_video_aliases_only }}" = "true" ]; then
            echo "Min/audio/video-aliases-only mode: publishing ffmpeg-kit-min + ffmpeg-kit-audio + ffmpeg-kit-video (real AARs), skipping primary/redirects."
            ./gradlew :ffmpeg-kit-android-lib:publishMavenMinPublicationToMavenCentralRepository \
              :ffmpeg-kit-android-lib:publishMavenAudioPublicationToMavenCentralRepository \
              :ffmpeg-kit-android-lib:publishMavenVideoPublicationToMavenCentralRepository \
              --no-configuration-cache --no-daemon \
              -x :ffmpeg-kit-android-lib:bundleReleaseAar \
              -Ppublish.version="${PUBLISH_VERSION}"
          elif [ "${{ github.event.inputs.min_gpl_alias_only }}" = "true" ]; then
            echo "Min-gpl-alias-only mode: publishing ffmpeg-kit-min-gpl (real AAR), skipping primary/redirects."
            ./gradlew :ffmpeg-kit-android-lib:publishMavenMinGplPublicationToMavenCentralRepository \
              --no-configuration-cache --no-daemon \
              -x :ffmpeg-kit-android-lib:bundleReleaseAar \
              -Ppublish.version="${PUBLISH_VERSION}"
          elif [ "${{ github.event.inputs.full_full_gpl_aliases_only }}" = "true" ]; then
            echo "Full/full-gpl-aliases-only mode: publishing ffmpeg-kit-full + ffmpeg-kit-full-gpl (real AARs), skipping primary/redirects."
            ./gradlew :ffmpeg-kit-android-lib:publishMavenFullPublicationToMavenCentralRepository \
              :ffmpeg-kit-android-lib:publishMavenFullGplPublicationToMavenCentralRepository \
              --no-configuration-cache --no-daemon \
              -x :ffmpeg-kit-android-lib:bundleReleaseAar \
              -Ppublish.version="${PUBLISH_VERSION}"
          elif [ "${{ github.event.inputs.redirects_only }}" = "true" ]; then
            echo "Redirects-only mode: publishing the search aliases AND the legacy ffmpeg-kit-free* name, skipping the primary artifact."
            ./gradlew :ffmpeg-kit-android-lib:publishMavenRedirectKitPublicationToMavenCentralRepository \
              :ffmpeg-kit-android-lib:publishMavenRedirectDashPublicationToMavenCentralRepository \
              :ffmpeg-kit-android-lib:publishMavenRedirectFreePublicationToMavenCentralRepository \
              --no-configuration-cache --no-daemon \
              -x :ffmpeg-kit-android-lib:bundleReleaseAar \
              -Ppublish.version="${PUBLISH_VERSION}"
          else
            POM_URL="https://repo1.maven.org/maven2/${GROUP//.//}/${ARTIFACT}/${VERSION}/${ARTIFACT}-${VERSION}.pom"
            if curl -sf "$POM_URL" > /dev/null 2>&1; then
              echo "Version ${VERSION} of ${ARTIFACT} already on Maven Central — skipping."
            else
              ./gradlew :ffmpeg-kit-android-lib:publishAndReleaseToMavenCentral \
                --no-configuration-cache --no-daemon \
                -x :ffmpeg-kit-android-lib:bundleReleaseAar \
                -Ppublish.version="${PUBLISH_VERSION}"
            fi
          fi
