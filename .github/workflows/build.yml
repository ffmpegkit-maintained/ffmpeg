name: Build 6.0 LTS (Full variant)
run-name: "Build 6.0 LTS — Full${{ startsWith(github.ref, 'refs/tags/') && format(' — {0}', github.ref_name) || '' }}"

on:
  push:
    # "v*" alone also matches v6.0.1-free/-basic/-gpl (glob isn't suffix-
    # anchored) - confirmed the hard way when pushing v6.0.1-free also
    # queued this Full-tier build. Exclude the other three 6.0-line tiers'
    # suffixed tags explicitly so each tag only triggers its own tier, and
    # likewise for all four 7.1 LTS line tags (-free71/-basic71/-full71/
    # -gpl71) - that line's own tiers, including its Full tier, must never
    # trigger this 6.0-line build either.
    tags: ["v*", "!v*-free", "!v*-basic", "!v*-gpl", "!v*-free71", "!v*-basic71", "!v*-full71", "!v*-gpl71", "!v*-free81", "!v*-basic81", "!v*-full81", "!v*-gpl81", "!v*-lts-android"]
  workflow_dispatch:

jobs:
  build:
    # Only the "full" variant is wired up — android.sh has no audio/video/https
    # presets (those are upstream's historical Maven Central artifact names, not
    # build flags). Only arm64-v8a is built/published; see README § Compatibility.
    #
    # Triggered on version tags only (not every push/PR): this is a from-source
    # FFmpeg build, easily 30-90+ minutes of compute — reserve it for actual
    # releases. Use workflow_dispatch for an on-demand test run.
    name: Build ffmpeg-kit (full, arm64-v8a)
    runs-on: ubuntu-24.04
    # A previous attempt hung silently for ~6h until GitHub's own hard cap
    # killed it (conclusion: cancelled, no error). Bound that here so a
    # repeat hang fails fast instead of burning a full day of turnaround.
    timeout-minutes: 180

    defaults:
      run:
        shell: bash
        working-directory: android-6.0-lts

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config curl git \
            build-essential yasm nasm gperf texinfo bison ragel \
            python3 python3-pip unzip zip wget meson ninja-build \
            doxygen cmake autogen autopoint groff gtk-doc-tools libtasn1-bin

      - name: Install Android platform 35
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          set -o pipefail
          "${ANDROID_HOME}"/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"

      - name: Cache Android NDK r27c
        id: cache-ndk
        uses: actions/cache@v6
        with:
          path: ~/.ndk
          key: ndk-r27c-linux

      - name: Download Android NDK r27c
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -s "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -o ndk.zip
          unzip -q -o ndk.zip -d "${HOME}/.ndk"

      - name: Export ANDROID_NDK_ROOT
        run: echo "ANDROID_NDK_ROOT=${HOME}/.ndk/$(ls "${HOME}/.ndk")" >> "$GITHUB_ENV"

      # actions/cache's restore-on-start/save-at-end model isn't enough on its
      # own: the save (post-step) is skipped entirely when the job is
      # cancelled or hits its timeout - which is exactly what happened twice
      # (one manual cancel, one 6h hard-timeout kill) - so it never actually
      # Belt-and-suspenders: a git branch as a checkpoint store, since a
      # `git push` that already succeeded is durable even if THIS job later
      # gets cancelled/timed out. Restores so
      # it can overlay anything more recent that a partial/killed run pushed
      # but never got to save through actions/cache's own post-step.
      #
      # Pushed to a SEPARATE PRIVATE repo (ffmpegkit-maintained/ffmpeg-cache-Private),
      # not a branch on this repo - this repo is public, and a branch here
      # would publicly expose the finished paid-tier .aar with zero
      # authentication needed (any `git clone --branch ci-cache ...` would
      # get it). Learned this the hard way: the original same-repo ci-cache/
      # ci-cache-basic/ci-cache-gpl branches did exactly that and were
      # deleted once found. CI_CACHE_TOKEN is a fine-grained PAT scoped to
      # just ffmpeg-cache-Private (Contents: read/write), since GITHUB_TOKEN
      # can't reach a different repo.
      - name: Restore latest build checkpoint from private cache repo
        env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${CI_CACHE_TOKEN}@github.com/ffmpegkit-maintained/ffmpeg-cache-Private.git"
          if git ls-remote --exit-code --heads "$REMOTE" full >/dev/null 2>&1; then
            echo "Found full branch in ffmpeg-cache-Private, restoring prebuilt/ and src/ from it"
            git fetch --depth=1 "$REMOTE" full
            git archive FETCH_HEAD | tar -x
            echo "Restored:"
            find prebuilt src -maxdepth 2 -type d 2>/dev/null | sort || true
          else
            echo "No full branch yet in ffmpeg-cache-Private - starting fresh"
          fi

      # --full enables both gnutls and openssl, which FFmpeg's own configure
      # refuses outright ("GnuTLS and OpenSSL must not be enabled at the same
      # time."). Keep OpenSSL (Apache-2.0, no GPL-adjacent licensing
      # questions) and drop GnuTLS.
      #
      # Pushes a checkpoint of prebuilt/ + src/ to the ci-cache branch every
      # 2 minutes in the background, so a hang/timeout-kill only loses the
      # last <2 minutes of progress instead of the entire run. Known caveat:
      # this can occasionally snapshot a library mid-install (cp racing with
      # make), which android.sh's own already-built check wouldn't catch -
      # acceptable risk for a resilience mechanism, not a correctness
      # guarantee; the 16 KB alignment check and AAR assembly step below
      # still have to pass either way.
      - name: Build full variant (arm64-v8a only)
        env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: |
          # flock prevents the background loop's checkpoint and the final
          # one (after kill+wait, which doesn't reliably block on an
          # in-flight push) from racing on the same ref - seen as
          # "cannot lock ref ... is at X but expected Y" on a first pass.
          checkpoint() {
            flock /tmp/checkpoint.lock -c '
              tmp=$(mktemp -d)
              cp -r prebuilt "$tmp/" 2>/dev/null
              cp -r src "$tmp/" 2>/dev/null
              ( cd "$tmp" \
                && git init -q -b full \
                && git add -A \
                && git -c user.email="ci-checkpoint@ffmpegkit-maintained" -c user.name="ci-checkpoint" commit -q -m "checkpoint $(date -u +%FT%TZ)" \
                && git push -q -f "https://x-access-token:${CI_CACHE_TOKEN}@github.com/ffmpegkit-maintained/ffmpeg-cache-Private.git" HEAD:full )
              rm -rf "$tmp"
            '
          }
          (
            while true; do
              sleep 120
              checkpoint || true
            done
          ) &
          CHECKPOINT_PID=$!

          touch build.log
          set +e
          ./android.sh --full --enable-android-media-codec --enable-android-zlib --disable-lib-gnutls --disable-arm-v7a --disable-arm-v7a-neon --disable-x86 --disable-x86-64
          BUILD_EXIT=$?
          kill "$CHECKPOINT_PID" 2>/dev/null || true
          wait "$CHECKPOINT_PID" 2>/dev/null || true
          checkpoint || true
          exit "$BUILD_EXIT"

      # Pipeline is stable now (all four tiers verified green) - no need to
      # live-stream build.log into the Actions log on every run anymore;
      # only dump it when something actually breaks.
      - name: Print build log on failure
        if: failure()
        run: cat build.log || echo "no build.log produced (failed before the build step ran)"

      - name: Print ffbuild config log on failure
        if: failure()
        run: '[[ -f ./src/ffmpeg/ffbuild/config.log ]] && tail -100 ./src/ffmpeg/ffbuild/config.log || true'

      - name: Print toolchain env and per-library config logs on failure
        if: failure()
        run: |
          echo "=== toolchain env ==="
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "AR=$AR"
          echo "AS=$AS"
          echo "LD=$LD"
          echo "STRIP=$STRIP"
          echo "RANLIB=$RANLIB"
          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "LDFLAGS=$LDFLAGS"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo
          echo "=== config.log files under src/ (most recently modified first) ==="
          while IFS= read -r log; do
            echo "--- $log ---"
            tail -150 "$log"
            echo
          done < <(find src -iname "config.log" -printf '%T@ %p\n' 2>/dev/null | sort -rn | cut -d' ' -f2- | head -3)

      # ⚠️ Les rustines de securite sont-elles DANS ce build ?
      #
      # Sur 6.0 et 7.1 les CVE arrivent par backport : `SOURCE_ID` ne bouge jamais, et
      # rien dans le tag pinne ne distingue un arbre avec les correctifs d'un arbre
      # sans. Un `prebuilt/` restaure du checkpoint peut donc expedier des binaires
      # sans les correctifs, avec un `check-filters --pin` qui passe -- puisque la
      # version, elle, est la bonne.
      #
      # Chaque rustine appliquee s'inscrit desormais dans `prebuilt/.security-patches`.
      # Ceci compare ce manifeste au jeu de rustines du depot et refuse de continuer
      # s'il en manque une, quelle qu'en soit la raison.
      - name: The security patches are in this build
        run: python3 ../tools/check-security-patches.py

      # ⚠️ On lit l'AAR LIVRE, pas l'arbre de compilation.
      #
      # L'etape precedente parcourait `find prebuilt -name "*.so"`. Elle ne voyait donc
      # pas `libc++_shared.so`, que Gradle ajoute en fabriquant l'AAR et qui est copiee
      # telle quelle du NDK -- aucun drapeau d'edition de liens ne l'atteint. Et elle ne
      # regardait que p_align, jamais PT_GNU_RELRO.
      #
      # Mesure du 2026-09-25 : elle etait verte sur les lignes 6.0 et 7.1 alors que
      # 7 de leurs 9 paliers publies ne se chargeaient pas du tout --
      # `dlopen failed: can't enable GNU RELRO protection … Out of memory`, parce que
      # le lld du NDK r26c arrondit RELRO a 16 Ko sans completer le dernier LOAD.
      #
      # Ce qu'un client installe, c'est l'AAR. C'est donc l'AAR qu'on lit.
      - name: The native libraries can be loaded (16 KB pages, RELRO)
        run: python3 ../tools/check-elf-16kb.py prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar

      # No actions/upload-artifact here on purpose: this is a paid Jokobee
      # tier, and Actions artifacts on a public repo are downloadable by any
      # signed-in GitHub user for free, not just collaborators - confirmed
      # directly and fixed by deleting everything already exposed that way.
      #
      # The .aar therefore leaves this runner through the private cache repo, and
      # ONLY through it. Restored at the start, pushed back here at the end.
      #
      # WARNING: the push half was removed on 2026-07-12 as "permanently broken
      # since an org-level workflow-permissions lockdown", and the comment saying
      # the build "already runs checkpoint one last time" was left behind. For ten
      # weeks this workflow restored an old checkpoint, verified THAT artifact, went
      # green, and discarded whatever it had just built. A build whose output nothing
      # can reach is not a build.
      # ⚠️ Verifies the .aar THIS run produced, which is not the same question as
      # "is there an .aar".
      #
      # The steps above check 16 KB alignment and the GPL licence, and both passed for
      # ten weeks on an artifact restored from a June checkpoint -- the build having
      # rebuilt nothing and pushed nothing. Green, and about the wrong file.
      #
      # Two things are asserted here, and neither can be satisfied by a stale file:
      #
      #   the FFmpeg version inside libavutil.so matches the pin in scripts/source.sh
      #   the filters this tier documents are actually in libavfilter.so
      #
      # The second is check-filters.py, added after issue #1: drawtext was absent from
      # every published build because harfbuzz was compiled and linked but never passed
      # to configure. Every check we had read the build inputs; this one reads the output.
      - name: Verify the built .aar matches the pin and the tier
        run: |
          set -e
          aar="prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar"
          # From `ffmpeg)` to its `;;`, not a fixed number of lines: a comment
          # added above SOURCE_ID pushed it out of a `-A 3` window, and the guard
          # silently read nothing. A window that assumes a position guards what it
          # assumed.
          pin=$(awk '/^  ffmpeg\)/,/;;/' scripts/source.sh | grep -oE 'SOURCE_ID="[^"]+"' | head -1 | cut -d'"' -f2)
          test -n "$pin" || { echo "::error::could not read the ffmpeg pin from scripts/source.sh"; exit 1; }
          python3 ../tools/check-filters.py "$aar" --tier full --pin "$pin"

      - name: Push the built .aar back to the private cache repo
        env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: |
          set -e
          # The job runs with working-directory set to the line's folder, so a relative
          # path here and $GITHUB_WORKSPACE/<same path> are two DIFFERENT files. The
          # first version tested one and copied the other: `test -f` passed, `cp` said
          # No such file or directory, and twenty-two minutes of real compiling were
          # thrown away. One path, resolved once, used by both.
          src_root=$(pwd)
          aar_path="$src_root/prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar"
          test -f "$aar_path" || { echo "::error::no .aar to push at $aar_path"; exit 1; }

          REMOTE="https://x-access-token:${CI_CACHE_TOKEN}@github.com/ffmpegkit-maintained/ffmpeg-cache-Private.git"
          WORK=$(mktemp -d)
          git init -q "$WORK"
          cd "$WORK"
          git config user.email "ci@ffmpegkit-maintained.invalid"
          git config user.name "ffmpeg-kit CI"

          mkdir -p prebuilt/bundle-android-aar/ffmpeg-kit
          cp "$aar_path" prebuilt/bundle-android-aar/ffmpeg-kit/
          for d in src prebuilt; do
            [ -d "$src_root/$d" ] && cp -r "$src_root/$d" . || true
          done

          git add -A
          git commit -q -m "checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ) from run ${GITHUB_RUN_ID}"
          git push -f "$REMOTE" HEAD:full
          echo "Pushed the built .aar to ffmpeg-cache-Private:full"
