name: Check Central Portal deployments

# Diagnostic only. It publishes nothing and changes nothing -- it asks the Sonatype
# Central Portal what state our deployments are in.
#
# Why it exists: after publishing 8.1.9, five workflow runs went green, the artifacts
# were signed and uploaded, and nothing appeared on Maven Central. From outside there
# is no way to tell "still propagating" from "validated, waiting for someone to press
# Publish". The credentials that could answer are organisation secrets, available here
# and nowhere else.
#
# The token is built from OSSRH_USERNAME/OSSRH_PASSWORD and never printed.

on:
  workflow_dispatch:

jobs:
  deployments:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the Central Portal
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          set -u
          TOKEN=$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_PASSWORD" | base64 -w0)

          # L'endpoint /deployments a refuse deux formes de corps. On arrete de
          # deviner et on utilise celui qui est documente : « cette coordonnee
          # est-elle publiee ? ». Il ne dit pas « en attente du bouton Publish »,
          # mais couple au 404 de repo1 il situe le probleme.
          for a in ffmpeg ffmpeg-kit-full-gpl ffmpeg-kit-min ffmpeg-kit-81; do
            r=$(curl -s -H "Authorization: Bearer $TOKEN"               "https://central.sonatype.com/api/v1/publisher/published?namespace=dev.ffmpegkit-maintained&name=$a&version=8.1.9")
            printf "  %-24s %s
" "$a:8.1.9" "$r"
          done

          echo ""
          echo "=== et 8.1.8, pour comparer avec une version qui EST publiee"
          r=$(curl -s -H "Authorization: Bearer $TOKEN"             "https://central.sonatype.com/api/v1/publisher/published?namespace=dev.ffmpegkit-maintained&name=ffmpeg-kit-full-gpl&version=8.1.8")
          printf "  %-24s %s
" "ffmpeg-kit-full-gpl:8.1.8" "$r"
