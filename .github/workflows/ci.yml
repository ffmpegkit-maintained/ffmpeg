name: CI (docs check)

# Lightweight, auto-triggered check — separate from the 12 tier/line build
# workflows (all tag-triggered, heavy FFmpeg compiles). Three LTS lines
# (6.0, 7.1, 8.1) coexist under the same Maven Central artifactId
# (dev.ffmpegkit-maintained:ffmpeg), each with its own version, so this
# checks every version README.md advertises against what's actually live.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs-version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docs version consistency check
        run: |
          LIVE=$(curl -sf "https://repo1.maven.org/maven2/dev/ffmpegkit-maintained/ffmpeg/maven-metadata.xml" \
            | grep -oP '<version>\K[^<]+')
          if [ -z "$LIVE" ]; then
            echo "::error::could not fetch published versions from Maven Central metadata"
            exit 1
          fi
          echo "Live on Maven Central (dev.ffmpegkit-maintained:ffmpeg):"
          echo "$LIVE"

          fail=0
          # Every version README.md claims for this artifact must actually be published.
          for v in $(grep -oP "dev\.ffmpegkit-maintained:ffmpeg:\K[0-9]+\.[0-9]+\.[0-9]+" README.md | sort -u); do
            if ! echo "$LIVE" | grep -qx "$v"; then
              echo "::error file=README.md::README references dev.ffmpegkit-maintained:ffmpeg:$v, but that version is not published on Maven Central — likely stale."
              fail=1
            fi
          done

          if [ "$fail" -eq 1 ]; then
            echo "::error::Docs mention a Maven Central version that isn't actually live. Update README.md to match a published version (see the <versions> list above)."
            exit 1
          fi
          echo "README.md's Maven Central version mentions are all live."

      # One line, one number, everywhere. A developer reading ffmpeg-kit-full:8.1.8
      # beside ffmpeg:8.1.7 cannot tell whether those are the same build, a fix that
      # landed in one place, or a mistake -- and neither can we, six weeks later.
      #
      # The 8.1 line drifted because 8.1.8 was a POM-only republication: 8.1.7 and
      # 8.1.8 of ffmpeg-kit-full-gpl are byte-identical, same SHA-256. Maven Central is
      # immutable, so a metadata fix has to ship as a new version carrying the same
      # binaries. It went out for the eight tier names and not for the primary or the
      # aliases. Nothing was wrong with doing that -- what was missing is anything that
      # noticed.
      #
      # WARNING: this is expected to FAIL until 6.0.4 / 7.1.7 / 8.1.9 are published
      # across every coordinate. That is the point: the check says when the job is
      # actually finished, not when we think it is.
      - name: One version per LTS line, across every coordinate
        run: python3 tools/check-versions.py

      # README and MIGRATION told developers that x86_64 "isn't available prebuilt --
      # compile it yourself". The 24 tier artifacts have carried x86_64 since they were
      # first published; the sentence was wrong for 24 of the 25 coordinates, and it
      # sent anyone on an emulator off to build from source for a binary already on
      # Maven Central. Same shape as the rest: the document described what we believed
      # we shipped.
      - name: The docs describe the ABIs we actually publish
        run: python3 tools/check-doc-abi.py

  build-scripts-are-runnable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The 8.1 security build of 2026-09-24 died sourcing function.sh: the scripts had
      # been edited from a Windows checkout with core.autocrlf=true, and the CRLF
      # travelled into the commit. bash reported only the symptom -- "get_arch_name:
      # command not found", four hundred times -- and never the cause.
      #
      # .gitattributes now pins *.sh to eol=lf. This reads back what the repository
      # actually holds, and then asks bash whether it parses.
      #
      # The check lives in a Python tool rather than inline grep/awk on purpose: those
      # read in text mode on Windows and silently strip the CR, so the first version of
      # this guard reported "clean" for a file that was not. It was caught by running it
      # against a CRLF witness, not by reading it.
      - name: Shell scripts parse, and carry no CR
        run: |
          set -e
          python3 tools/check-eol.py
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; }
          done < <(git ls-files "*.sh")
          [ "$fail" -eq 0 ] || exit 1
          echo "All tracked shell scripts parse."
      # The second defect of issue #1: a pointer freed on an error path that the
      # failing call never wrote. No compiler flag sees it -- measured with the NDK's
      # own clang, neither -Wall -Wextra nor -Wconditional-uninitialized says anything,
      # because the address is handed to a callee and clang assumes the callee writes
      # it. And no runtime test sees it either: freeing an uninitialised pointer is
      # undefined behaviour, and 180 failing parses against the unfixed binary on a
      # Pixel 7 Pro crashed nothing, the stack value there being null.
      #
      # Neither the compiler nor the device can witness this class of defect, so the
      # source is read instead.
      # Second net only. The real protection is that the .aar never enters the tree
      # (test-app takes it with -PtestAar=<path>) and a pre-commit hook that refuses
      # the commit -- `git config core.hooksPath .githooks`. This step runs after the
      # push, when a paid artifact would already be public, so it exists for a clone
      # that never set the hook, not as the guard itself.
      - name: No unexpected binary is tracked
        run: python3 tools/check-no-paid-binaries.py

      - name: No pointer freed on an error path without an initialiser
        run: python3 tools/check-uninit-free.py

