name: Build 8.1 LTS (Full variant)
run-name: "Build 8.1 LTS — Full${{ startsWith(github.ref, 'refs/tags/') && format(' — {0}', github.ref_name) || '' }}"

# FFmpeg 8.1 LTS line - coexists with the original 6.0-lts Full tier
# (build.yml), distinct tag suffix (-full81, since the 6.0-lts Full tier
# uses no suffix at all - this one needs one to avoid colliding with
# build.yml's "v*" catch-all, which is why build.yml now explicitly
# excludes "!v*-full81" too). Same library set: --full (everything LGPL-
# compatible), arm64-v8a only. See docs/PATCH-NOTES.md for the FFmpeg
# 6.0 -> 8.1.2 port findings (two small fixes needed, no JNI rewrite,
# runtime-verified on a real Pixel 7 Pro).

on:
  push:
    tags: ["v*-full81"]
  workflow_dispatch:

jobs:
  build:
    name: Build ffmpeg-kit 8.1 LTS (full, arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    defaults:
      run:
        shell: bash
        working-directory: android-8.1-lts

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config curl git \
            build-essential yasm nasm gperf texinfo bison ragel \
            python3 python3-pip unzip zip wget meson ninja-build \
            doxygen cmake autogen autopoint groff gtk-doc-tools libtasn1-bin

      - name: Install Android platform 35
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          set -o pipefail
          "${ANDROID_HOME}"/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"

      - name: Cache Android NDK r27c
        id: cache-ndk
        uses: actions/cache@v6
        with:
          path: ~/.ndk
          key: ndk-r27c-linux

      - name: Download Android NDK r27c
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -s "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -o ndk.zip
          unzip -q -o ndk.zip -d "${HOME}/.ndk"

      - name: Export ANDROID_NDK_ROOT
        run: echo "ANDROID_NDK_ROOT=${HOME}/.ndk/$(ls "${HOME}/.ndk")" >> "$GITHUB_ENV"

      # Pushed to a SEPARATE PRIVATE repo (ffmpegkit-maintained/ffmpeg-cache-Private),
      # not a branch on this repo - same rationale as the 6.0-lts paid
      # tiers. Distinct branch name (81-full) from the production 6.0
      # "full" branch and from the diagnostic "port81-full" branch used
      # while validating this port - must never collide with either.
      - name: Restore latest build checkpoint from private cache repo
        env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${CI_CACHE_TOKEN}@github.com/ffmpegkit-maintained/ffmpeg-cache-Private.git"
          if git ls-remote --exit-code --heads "$REMOTE" 81-full >/dev/null 2>&1; then
            echo "Found 81-full branch in ffmpeg-cache-Private, restoring prebuilt/ and src/ from it"
            git fetch --depth=1 "$REMOTE" 81-full
            git archive FETCH_HEAD | tar -x
            echo "Restored:"
            find prebuilt src -maxdepth 2 -type d 2>/dev/null | sort || true
          else
            echo "No 81-full branch yet in ffmpeg-cache-Private - starting fresh"
          fi

      - name: Build full variant (arm64-v8a only)
        env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: |

          touch build.log
          set +e
          ./android.sh --full --enable-whisper --enable-android-media-codec --enable-android-zlib --disable-lib-gnutls --disable-arm-v7a --disable-arm-v7a-neon --disable-x86 --disable-x86-64
          BUILD_EXIT=$?
          exit "$BUILD_EXIT"

      - name: Print build log on failure
        if: failure() || cancelled()
        run: cat build.log || echo "no build.log produced (failed before the build step ran)"

      - name: Print ffbuild config log on failure
        if: failure() || cancelled()
        run: '[[ -f ./src/ffmpeg/ffbuild/config.log ]] && tail -100 ./src/ffmpeg/ffbuild/config.log || true'

      - name: Print toolchain env and per-library config logs on failure
        if: failure() || cancelled()
        run: |
          echo "=== toolchain env ==="
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "AR=$AR"
          echo "AS=$AS"
          echo "LD=$LD"
          echo "STRIP=$STRIP"
          echo "RANLIB=$RANLIB"
          echo "CFLAGS=$CFLAGS"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "LDFLAGS=$LDFLAGS"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo
          echo "=== config.log files under src/ (most recently modified first) ==="
          while IFS= read -r log; do
            echo "--- $log ---"
            tail -150 "$log"
            echo
          done < <(find src -iname "config.log" -printf '%T@ %p\n' 2>/dev/null | sort -rn | cut -d' ' -f2- | head -3)

      # ⚠️ Les rustines de securite sont-elles DANS ce build ?
      #
      # Sur 6.0 et 7.1 les CVE arrivent par backport : `SOURCE_ID` ne bouge jamais, et
      # rien dans le tag pinne ne distingue un arbre avec les correctifs d'un arbre
      # sans. Un `prebuilt/` restaure du checkpoint peut donc expedier des binaires
      # sans les correctifs, avec un `check-filters --pin` qui passe -- puisque la
      # version, elle, est la bonne.
      #
      # Chaque rustine appliquee s'inscrit desormais dans `prebuilt/.security-patches`.
      # Ceci compare ce manifeste au jeu de rustines du depot et refuse de continuer
      # s'il en manque une, quelle qu'en soit la raison.
      # ⚠️ La chaine d'outils en usage est-elle celle que la ligne declare ?
      #
      # C'est deja arrive : 8.1.3 a ete publie en annoncant le r27c alors que l'URL de
      # telechargement du workflow pointait encore sur le r26c. Deux endroits nomment le
      # NDK et rien ne les comparait. Maven Central etant immuable, une version publiee
      # sur la foi d'une chaine d'outils qui n'est pas la sienne ne se corrige pas.
      - name: The NDK in use is the one this line declares
        run: python3 ../tools/check-ndk.py

      - name: The security patches are in this build
        run: python3 ../tools/check-security-patches.py

      # ⚠️ On lit l'AAR LIVRE, pas l'arbre de compilation.
      #
      # L'etape precedente parcourait `find prebuilt -name "*.so"`. Elle ne voyait donc
      # pas `libc++_shared.so`, que Gradle ajoute en fabriquant l'AAR et qui est copiee
      # telle quelle du NDK -- aucun drapeau d'edition de liens ne l'atteint. Et elle ne
      # regardait que p_align, jamais PT_GNU_RELRO.
      #
      # Mesure du 2026-09-25 : elle etait verte sur les lignes 6.0 et 7.1 alors que
      # 7 de leurs 9 paliers publies ne se chargeaient pas du tout --
      # `dlopen failed: can't enable GNU RELRO protection … Out of memory`, parce que
      # le lld du NDK r26c arrondit RELRO a 16 Ko sans completer le dernier LOAD.
      #
      # Ce qu'un client installe, c'est l'AAR. C'est donc l'AAR qu'on lit.
      - name: The native libraries can be loaded (16 KB pages, RELRO)
        run: python3 ../tools/check-elf-16kb.py prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar

      # No actions/upload-artifact here on purpose - paid Jokobee tier, and
      # Actions artifacts on a public repo are downloadable by any signed-in
      # GitHub user for free.
      #
      # The .aar therefore leaves this runner through the private cache repo, and
      # ONLY through it. Restored at the start, pushed back here at the end.
      #
      # WARNING: the push half was removed on 2026-07-12 as "permanently broken
      # since an org-level workflow-permissions lockdown", and the comment that
      # said the build "already pushed the finished .aar" was left behind. For ten
      # weeks this workflow restored a June checkpoint, verified THAT artifact's
      # 16 KB alignment and GPL licence, went green, and discarded whatever it had
      # just built. A build whose output nothing can reach is not a build.
      #
      # It is restored here with the failure made loud: if the push does not work,
      # the job fails rather than ending green with nothing to show for itself.
      # ⚠️ Verifies the .aar THIS run produced, which is not the same question as
      # "is there an .aar".
      #
      # The steps above check 16 KB alignment and the GPL licence, and both passed for
      # ten weeks on an artifact restored from a June checkpoint -- the build having
      # rebuilt nothing and pushed nothing. Green, and about the wrong file.
      #
      # Two things are asserted here, and neither can be satisfied by a stale file:
      #
      #   the FFmpeg version inside libavutil.so matches the pin in scripts/source.sh
      #   the filters this tier documents are actually in libavfilter.so
      #
      # The second is check-filters.py, added after issue #1: drawtext was absent from
      # every published build because harfbuzz was compiled and linked but never passed
      # to configure. Every check we had read the build inputs; this one reads the output.
      - name: Verify the built .aar matches the pin and the tier
        run: |
          set -e
          aar="prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar"
          # From `ffmpeg)` to its `;;`, not a fixed number of lines: a comment
          # added above SOURCE_ID pushed it out of a `-A 3` window, and the guard
          # silently read nothing. A window that assumes a position guards what it
          # assumed.
          pin=$(awk '/^  ffmpeg\)/,/;;/' scripts/source.sh | grep -oE 'SOURCE_ID="[^"]+"' | head -1 | cut -d'"' -f2)
          test -n "$pin" || { echo "::error::could not read the ffmpeg pin from scripts/source.sh"; exit 1; }
          python3 ../tools/check-filters.py "$aar" --tier full --pin "$pin"

      - name: Push the built .aar back to the private cache repo
        env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: |
          set -e
          # ⚠️ The job runs with working-directory set to the line's folder, so a
          # relative path here and $GITHUB_WORKSPACE/<same path> are two DIFFERENT
          # files. The first version of this step tested one and copied the other:
          # `test -f` passed, `cp` said No such file or directory, and the build died
          # after twenty-two minutes of real compiling with nothing published.
          #
          # Same shape as the defect this whole release exists for -- the check read
          # one thing, the action used another. One path, resolved once, used by both.
          src_root=$(pwd)
          aar_path="$src_root/prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar"
          test -f "$aar_path" || { echo "::error::no .aar to push at $aar_path"; exit 1; }

          REMOTE="https://x-access-token:${CI_CACHE_TOKEN}@github.com/ffmpegkit-maintained/ffmpeg-cache-Private.git"
          WORK=$(mktemp -d)
          git init -q "$WORK"
          cd "$WORK"
          git config user.email "ci@ffmpegkit-maintained.invalid"
          git config user.name "ffmpeg-kit CI"

          mkdir -p prebuilt/bundle-android-aar/ffmpeg-kit
          cp "$aar_path" prebuilt/bundle-android-aar/ffmpeg-kit/
          # src/ and prebuilt/ are what makes the next run fast; carry them too when
          # they exist, so the checkpoint keeps its original purpose.
          for d in src prebuilt; do
            [ -d "$src_root/$d" ] && cp -r "$src_root/$d" . || true
          done

          git add -A
          git commit -q -m "checkpoint $(date -u +%Y-%m-%dT%H:%M:%SZ) from run ${GITHUB_RUN_ID}"
          git push -f "$REMOTE" HEAD:81-full
          echo "Pushed the built .aar to ffmpeg-cache-Private:81-full"

